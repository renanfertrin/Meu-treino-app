<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101114" />
  <title>Meu Treino</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{--bg:#0d0f12;--panel:#16191f;--panel2:#1d2129;--text:#f5f7fa;--muted:#a6adbb;--line:#2a303a;--accent:#7cff8a;--danger:#ff6b6b;--shadow:0 8px 30px rgba(0,0,0,.25)}
    *{box-sizing:border-box} body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    button,input,select{font:inherit}.app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:10;background:rgba(13,15,18,.92);backdrop-filter:blur(14px);padding:18px 16px 10px;border-bottom:1px solid var(--line)}
    .top h1{font-size:24px;margin:0}.top p{color:var(--muted);margin:4px 0 0}.content{padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
    .row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:12px;border:1px solid var(--line)}
    .btn{border:0;border-radius:12px;padding:11px 13px;background:var(--panel2);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:#08100a;font-weight:750}.btn.danger{color:#ffd7d7;background:#3a2020}.btn.small{padding:8px 10px;font-size:13px}.btn:active{transform:translateY(1px)}
    input,select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px;outline:none}input:focus,select:focus{border-color:#54606f}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    .nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(17,19,24,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:center}.nav-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(620px,100%)}.nav button{background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:12px}.nav button.active{color:var(--accent);background:#19221b}.nav span{display:block;font-size:11px;margin-top:3px}
    .ex{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.ex:first-child{border-top:0}.ex-title{font-weight:700}.ex-meta{font-size:12px;color:var(--muted);margin-top:3px}.check{width:24px;height:24px;accent-color:var(--accent)}
    .sheet-title{font-size:18px;font-weight:800}.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}.empty{text-align:center;color:var(--muted);padding:28px 10px}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:min(620px,100%);max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 14px}.hidden{display:none!important}.searchbar{display:grid;grid-template-columns:1fr 140px;gap:8px;margin-bottom:12px}.badge{font-size:11px;color:#bdf4c4}.session-banner{background:#132017;border-color:#26482c}.done .ex-title{text-decoration:line-through;color:#87908f}.progress{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent)}
    @media(max-width:420px){.searchbar{grid-template-columns:1fr}.row.wrap{flex-wrap:wrap}}
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <header class="top"><div class="row between"><div><h1 id="pageTitle">Minhas fichas</h1><p id="pageSub">Monte e acompanhe seus treinos.</p></div><button id="cloudBtn" class="btn small" onclick="cloudAccount()">☁️ Entrar</button></div></header>
  <main class="content" id="content"></main>
</div>
<nav class="nav"><div class="nav-inner">
  <button data-tab="plans" class="active" onclick="setTab('plans')">🏋️<span>Fichas</span></button>
  <button data-tab="library" onclick="setTab('library')">🔎<span>Exercícios</span></button>
  <button data-tab="history" onclick="setTab('history')">📊<span>Histórico</span></button>
</div></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this) closeModal()"><div class="modalbox" id="modalbox"></div></div>
<script>
const BASE_EXERCISES = [
['Supino reto com barra','Peito','Peitoral maior, tríceps, deltoide anterior','Barra e banco'],['Supino reto com halteres','Peito','Peitoral maior, tríceps, deltoide anterior','Halteres e banco'],['Supino inclinado com barra','Peito','Peitoral superior, tríceps, deltoide anterior','Barra e banco inclinado'],['Supino inclinado com halteres','Peito','Peitoral superior, tríceps, deltoide anterior','Halteres e banco inclinado'],['Supino declinado','Peito','Peitoral inferior, tríceps','Barra ou halteres'],['Crucifixo reto','Peito','Peitoral maior','Halteres e banco'],['Crucifixo inclinado','Peito','Peitoral superior','Halteres e banco inclinado'],['Crossover na polia','Peito','Peitoral maior','Polia'],['Peck deck / Voador','Peito','Peitoral maior','Máquina'],['Flexão de braços','Peito','Peitoral, tríceps, deltoide anterior','Peso corporal'],
['Puxada frontal aberta','Costas','Latíssimo do dorso, bíceps','Polia alta'],['Puxada frontal pegada neutra','Costas','Latíssimo do dorso, bíceps','Polia alta'],['Barra fixa','Costas','Latíssimo do dorso, bíceps','Barra fixa'],['Remada curvada com barra','Costas','Dorsais, romboides, trapézio, bíceps','Barra'],['Remada unilateral com halter','Costas','Latíssimo, romboides, bíceps','Halter'],['Remada baixa sentada','Costas','Dorsais, romboides, bíceps','Polia baixa'],['Remada cavalinho','Costas','Dorsais, romboides, trapézio','Barra/T-bar'],['Pulldown com braços estendidos','Costas','Latíssimo do dorso','Polia'],['Pullover com halter','Costas','Latíssimo e peitoral','Halter e banco'],['Levantamento terra','Costas','Cadeia posterior, lombar, glúteos, posteriores','Barra'],
['Agachamento livre','Pernas','Quadríceps, glúteos, posteriores','Barra'],['Agachamento frontal','Pernas','Quadríceps, glúteos, core','Barra'],['Agachamento goblet','Pernas','Quadríceps, glúteos, core','Halter'],['Leg press 45°','Pernas','Quadríceps, glúteos, posteriores','Máquina'],['Hack squat','Pernas','Quadríceps, glúteos','Máquina'],['Cadeira extensora','Pernas','Quadríceps','Máquina'],['Mesa flexora','Pernas','Posteriores da coxa','Máquina'],['Cadeira flexora','Pernas','Posteriores da coxa','Máquina'],['Stiff com barra','Pernas','Posteriores, glúteos, lombar','Barra'],['Stiff com halteres','Pernas','Posteriores, glúteos, lombar','Halteres'],['Afundo / Passada','Pernas','Quadríceps, glúteos, posteriores','Peso corporal/halteres'],['Agachamento búlgaro','Pernas','Quadríceps, glúteos','Banco e halteres'],['Elevação pélvica / Hip thrust','Glúteos','Glúteo máximo, posteriores','Barra e banco'],['Glúteo na polia','Glúteos','Glúteo máximo','Polia'],['Cadeira abdutora','Glúteos','Glúteo médio e mínimo','Máquina'],['Cadeira adutora','Pernas','Adutores da coxa','Máquina'],['Panturrilha em pé','Panturrilhas','Gastrocnêmio','Máquina/peso livre'],['Panturrilha sentada','Panturrilhas','Sóleo, gastrocnêmio','Máquina'],['Panturrilha no leg press','Panturrilhas','Gastrocnêmio e sóleo','Leg press'],
['Desenvolvimento militar com barra','Ombros','Deltoides, tríceps','Barra'],['Desenvolvimento com halteres','Ombros','Deltoides, tríceps','Halteres'],['Elevação lateral','Ombros','Deltoide lateral','Halteres'],['Elevação lateral na polia','Ombros','Deltoide lateral','Polia'],['Elevação frontal','Ombros','Deltoide anterior','Halteres/anilha'],['Crucifixo inverso','Ombros','Deltoide posterior, romboides','Halteres/máquina'],['Face pull','Ombros','Deltoide posterior, trapézio, manguito','Polia'],['Encolhimento de ombros','Trapézio','Trapézio superior','Barra/halteres'],
['Rosca direta com barra','Bíceps','Bíceps braquial, braquial','Barra'],['Rosca alternada','Bíceps','Bíceps braquial','Halteres'],['Rosca martelo','Bíceps','Braquial, braquiorradial, bíceps','Halteres'],['Rosca Scott','Bíceps','Bíceps braquial','Banco Scott'],['Rosca concentrada','Bíceps','Bíceps braquial','Halter'],['Rosca na polia baixa','Bíceps','Bíceps braquial','Polia'],
['Tríceps na polia com barra','Tríceps','Tríceps braquial','Polia'],['Tríceps corda','Tríceps','Tríceps braquial','Polia'],['Tríceps testa','Tríceps','Tríceps braquial','Barra/halteres'],['Tríceps francês','Tríceps','Tríceps, ênfase cabeça longa','Halter/polia'],['Mergulho nas paralelas','Tríceps','Tríceps, peitoral, deltoide anterior','Paralelas'],['Supino fechado','Tríceps','Tríceps e peitoral','Barra e banco'],
['Abdominal crunch','Abdômen','Reto abdominal','Peso corporal'],['Abdominal na polia','Abdômen','Reto abdominal','Polia'],['Elevação de pernas','Abdômen','Reto abdominal, flexores do quadril','Peso corporal'],['Prancha','Abdômen','Core, reto abdominal, transverso','Peso corporal'],['Prancha lateral','Abdômen','Oblíquos, core','Peso corporal'],['Abdominal bicicleta','Abdômen','Reto abdominal, oblíquos','Peso corporal'],
['Rosca de punho','Antebraço','Flexores do antebraço','Barra/halteres'],['Rosca inversa','Antebraço','Braquiorradial, extensores, bíceps','Barra'],['Caminhada do fazendeiro','Corpo inteiro','Pegada, trapézio, core, pernas','Halteres/kettlebells']
].map((e,i)=>({id:'e'+(i+1),name:e[0],group:e[1],muscles:e[2],equipment:e[3]}));
const key='meuTreinoV1';
let state=JSON.parse(localStorage.getItem(key)||'null')||{plans:[{id:crypto.randomUUID(),name:'Ficha A',items:[]},{id:crypto.randomUUID(),name:'Ficha B',items:[]},{id:crypto.randomUUID(),name:'Ficha C',items:[]}],history:[],session:null,customExercises:[]};
if(!Array.isArray(state.customExercises))state.customExercises=[];
function allExercises(){return [...BASE_EXERCISES,...state.customExercises].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}))}
function exerciseById(id){return allExercises().find(x=>x.id===id)}
let tab='plans';
const SUPABASE_URL='https://skwygbahzutobygkvavw.supabase.co';
const SUPABASE_KEY='sb_publishable_sjyAqe_1ck8c4PHG0Yzj1A_yv7eegQN';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cloudUser=null, cloudTimer=null;
function save(){localStorage.setItem(key,JSON.stringify(state));if(cloudUser){clearTimeout(cloudTimer);cloudTimer=setTimeout(syncToCloud,500)}}
async function syncToCloud(){if(!cloudUser)return;let {error}=await sb.from('workout_app_state').upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)console.error('Falha ao sincronizar',error)}
async function loadCloud(){if(!cloudUser)return;let {data,error}=await sb.from('workout_app_state').select('data').eq('user_id',cloudUser.id).maybeSingle();if(error){console.error(error);return}if(data?.data){state=data.data;if(!Array.isArray(state.customExercises))state.customExercises=[];localStorage.setItem(key,JSON.stringify(state));render()}else await syncToCloud()}
async function initCloud(){let {data:{session}}=await sb.auth.getSession();cloudUser=session?.user||null;updateCloudButton();if(cloudUser)await loadCloud();sb.auth.onAuthStateChange(async(_e,session)=>{cloudUser=session?.user||null;updateCloudButton();if(cloudUser)await loadCloud()})}
function updateCloudButton(){let b=document.getElementById('cloudBtn');if(b)b.textContent=cloudUser?'☁️ Sincronizado':'☁️ Entrar'}
function cloudAccount(){if(cloudUser){openModal(`<h2>Conta e sincronização</h2><div class="muted" style="margin-bottom:12px">Conectado como ${esc(cloudUser.email||'usuário')}. Seus treinos são sincronizados com o Supabase.</div><button class="btn primary" style="width:100%;margin-bottom:8px" onclick="syncToCloud();closeModal()">Sincronizar agora</button><button class="btn danger" style="width:100%" onclick="logoutCloud()">Sair</button>`)}else openModal(`<h2>Entrar no Meu Treino</h2><div class="muted" style="margin-bottom:12px">Use seu e-mail para manter fichas e histórico iguais no celular e computador.</div><div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-bottom:8px" onclick="loginCloud()">Entrar</button><button class="btn" style="width:100%" onclick="signupCloud()">Criar minha conta</button>`)}
async function loginCloud(){let email=loginEmail.value.trim(),password=loginPassword.value;let {error}=await sb.auth.signInWithPassword({email,password});if(error)return alert('Não foi possível entrar: '+error.message);closeModal()}
async function signupCloud(){let email=loginEmail.value.trim(),password=loginPassword.value;if(password.length<6)return alert('Use uma senha com pelo menos 6 caracteres.');let {data,error}=await sb.auth.signUp({email,password});if(error)return alert('Não foi possível criar a conta: '+error.message);if(!data.session)alert('Conta criada. Confirme o e-mail recebido e depois entre no aplicativo.');else closeModal()}
async function logoutCloud(){await sb.auth.signOut();closeModal();render()}

function setTab(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let title='Minhas fichas',sub='Monte e acompanhe seus treinos.';if(tab==='library'){title='Biblioteca';sub=`${allExercises().length} exercícios já cadastrados.`}if(tab==='history'){title='Histórico';sub='Treinos concluídos e progresso.'}pageTitle.textContent=title;pageSub.textContent=sub;content.innerHTML=tab==='plans'?plansView():tab==='library'?libraryView():historyView()}
function plansView(){let h='';if(state.session)h+=sessionCard();h+=`<button class="btn primary" style="width:100%;margin-bottom:14px" onclick="newPlan()">＋ Nova ficha</button>`;h+=state.plans.map(p=>`<div class="card"><div class="row between"><div><div class="sheet-title">${esc(p.name)}</div><div class="muted">${p.items.length} exercício${p.items.length===1?'':'s'}</div></div><button class="btn small" onclick="planMenu('${p.id}')">•••</button></div>${p.items.slice(0,4).map(i=>{let e=allExercises().find(x=>x.id===i.exerciseId);return `<div class="ex"><div class="grow"><div class="ex-title">${esc(e?.name||'Exercício')}</div><div class="ex-meta">${i.sets} séries × ${esc(i.reps)} reps · ${esc(e?.group||'')}</div></div></div>`}).join('')}${p.items.length>4?`<div class="muted" style="padding-top:8px">+ ${p.items.length-4} exercícios</div>`:''}<div class="row" style="margin-top:12px"><button class="btn grow" onclick="editPlan('${p.id}')">Editar ficha</button><button class="btn primary grow" ${p.items.length?'':'disabled'} onclick="startSession('${p.id}')">Iniciar treino</button></div></div>`).join('');return h}
function sessionCard(){let s=state.session,p=state.plans.find(x=>x.id===s.planId),done=s.items.filter(x=>x.done).length,total=s.items.length,pc=total?Math.round(done/total*100):0;return `<div class="card session-banner"><div class="row between"><div><span class="badge">TREINO EM ANDAMENTO</span><div class="sheet-title">${esc(p?.name||'Treino')}</div><div class="muted">${done} de ${total} exercícios concluídos</div></div><button class="btn primary" onclick="openSession()">Continuar</button></div><div class="progress"><div style="width:${pc}%"></div></div></div>`}
function libraryView(){return `<button class="btn primary" style="width:100%;margin-bottom:12px" onclick="newCustomExercise()">＋ Adicionar novo exercício</button><div class="searchbar"><input id="q" placeholder="Buscar exercício..." oninput="filterLibrary()"><select id="group" onchange="filterLibrary()"><option value="">Todas regiões</option>${[...new Set(allExercises().map(e=>e.group))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div id="libList">${exerciseCards(allExercises())}</div>`}
function filterLibrary(){let q=document.getElementById('q').value.toLowerCase(),g=document.getElementById('group').value;let arr=allExercises().filter(e=>(!g||e.group===g)&&(!q||[e.name,e.group,e.muscles,e.equipment].join(' ').toLowerCase().includes(q)));libList.innerHTML=exerciseCards(arr)}
function exerciseCards(arr){return arr.length?arr.map(e=>`<div class="card"><div class="row between"><div class="grow"><div class="ex-title">${esc(e.name)} ${e.custom?'<span class=\"badge\">MEU EXERCÍCIO</span>':''}</div><div class="ex-meta">${esc(e.group)} · ${esc(e.equipment)}</div></div><span class="pill">${esc(e.group)}</span></div><div class="muted" style="margin-top:9px">Trabalha: ${esc(e.muscles)}</div>${e.custom?`<div class="row" style="margin-top:10px"><button class="btn small" onclick="editCustomExercise('${e.id}')">Editar</button><button class="btn small danger" onclick="deleteCustomExercise('${e.id}')">Excluir</button></div>`:''}</div>`).join(''):'<div class="empty">Nenhum exercício encontrado.</div>'}
function newCustomExercise(){openModal(`<h2>Novo exercício</h2><div class="field"><label>Nome do exercício</label><input id="ceName" placeholder="Ex.: Remada articulada"></div><div class="field"><label>Região do corpo</label><input id="ceGroup" list="groupOptions" placeholder="Ex.: Costas"><datalist id="groupOptions">${[...new Set(allExercises().map(e=>e.group))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div><div class="field"><label>Músculos trabalhados</label><input id="ceMuscles" placeholder="Ex.: latíssimo, romboides e bíceps"></div><div class="field"><label>Equipamento</label><input id="ceEquipment" placeholder="Ex.: Máquina"></div><button class="btn primary" style="width:100%" onclick="saveCustomExercise()">Salvar exercício</button>`)}
function saveCustomExercise(editId=null){let name=ceName.value.trim(),group=ceGroup.value.trim(),muscles=ceMuscles.value.trim(),equipment=ceEquipment.value.trim();if(!name||!group){alert('Preencha pelo menos o nome e a região do corpo.');return}let dup=allExercises().find(e=>e.name.localeCompare(name,'pt-BR',{sensitivity:'base'})===0&&e.id!==editId);if(dup){alert('Já existe um exercício com esse nome.');return}if(editId){let e=state.customExercises.find(x=>x.id===editId);Object.assign(e,{name,group,muscles:muscles||'Não informado',equipment:equipment||'Não informado'})}else state.customExercises.push({id:'c'+crypto.randomUUID(),name,group,muscles:muscles||'Não informado',equipment:equipment||'Não informado',custom:true});save();closeModal();render()}
function editCustomExercise(id){let e=state.customExercises.find(x=>x.id===id);if(!e)return;openModal(`<h2>Editar exercício</h2><div class="field"><label>Nome do exercício</label><input id="ceName" value="${esc(e.name)}"></div><div class="field"><label>Região do corpo</label><input id="ceGroup" value="${esc(e.group)}"></div><div class="field"><label>Músculos trabalhados</label><input id="ceMuscles" value="${esc(e.muscles)}"></div><div class="field"><label>Equipamento</label><input id="ceEquipment" value="${esc(e.equipment)}"></div><button class="btn primary" style="width:100%" onclick="saveCustomExercise('${id}')">Salvar alterações</button>`)}
function deleteCustomExercise(id){let inUse=state.plans.some(p=>p.items.some(i=>i.exerciseId===id))||state.session?.items.some(i=>i.exerciseId===id);if(inUse){alert('Esse exercício está sendo usado em uma ficha ou treino em andamento. Remova-o de lá antes de excluir.');return}if(confirm('Excluir este exercício da biblioteca?')){state.customExercises=state.customExercises.filter(x=>x.id!==id);save();render()}}
function historyView(){if(!state.history.length)return '<div class="card empty">Você ainda não concluiu nenhum treino.</div>';return state.history.slice().reverse().map(h=>`<div class="card"><div class="row between"><div><div class="sheet-title">${esc(h.planName)}</div><div class="muted">${new Date(h.finishedAt).toLocaleString('pt-BR')}</div></div><span class="pill">${h.completed}/${h.total}</span></div>${h.substitutions?`<div class="muted" style="margin-top:8px">${h.substitutions} substituição(ões) durante o treino</div>`:''}</div>`).join('')}
function openModal(html){modalbox.innerHTML=html;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}
function newPlan(){openModal(`<h2>Nova ficha</h2><div class="field"><label>Nome da ficha</label><input id="newPlanName" value="Ficha ${String.fromCharCode(65+state.plans.length)}"></div><button class="btn primary" style="width:100%" onclick="createPlan()">Criar ficha</button>`)}
function createPlan(){let n=newPlanName.value.trim()||'Nova ficha';let p={id:crypto.randomUUID(),name:n,items:[]};state.plans.push(p);save();closeModal();editPlan(p.id)}
function planMenu(id){let p=state.plans.find(x=>x.id===id);openModal(`<h2>${esc(p.name)}</h2><button class="btn" style="width:100%;margin-bottom:8px" onclick="renamePlan('${id}')">Renomear ficha</button><button class="btn danger" style="width:100%" onclick="deletePlan('${id}')">Excluir ficha</button>`)}
function renamePlan(id){let p=state.plans.find(x=>x.id===id);openModal(`<h2>Renomear ficha</h2><div class="field"><input id="rename" value="${esc(p.name)}"></div><button class="btn primary" style="width:100%" onclick="doRename('${id}')">Salvar</button>`)}
function doRename(id){state.plans.find(x=>x.id===id).name=rename.value.trim()||'Ficha';save();closeModal();render()}
function deletePlan(id){if(state.session?.planId===id)state.session=null;state.plans=state.plans.filter(x=>x.id!==id);save();closeModal();render()}
function editPlan(id){let p=state.plans.find(x=>x.id===id);openModal(`<div class="row between"><h2 style="margin:0">${esc(p.name)}</h2><button class="btn small" onclick="closeModal()">Fechar</button></div><div id="planItems">${planItemsHtml(p)}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="chooseExercise('${id}')">＋ Adicionar exercício</button>`)}
function planItemsHtml(p){return p.items.length?p.items.map((i,idx)=>{let e=allExercises().find(x=>x.id===i.exerciseId);return `<div class="ex"><div class="grow"><div class="ex-title">${idx+1}. ${esc(e.name)}</div><div class="ex-meta">${esc(e.group)} · ${esc(e.muscles)}</div><div class="row" style="margin-top:8px"><input style="width:90px" type="number" min="1" value="${i.sets}" onchange="updateItem('${p.id}','${i.id}','sets',this.value)"><input value="${esc(i.reps)}" placeholder="Reps" onchange="updateItem('${p.id}','${i.id}','reps',this.value)"><button class="btn small danger" onclick="removeItem('${p.id}','${i.id}')">✕</button></div></div></div>`}).join(''):'<div class="empty">Adicione os exercícios desta ficha.</div>'}
function chooseExercise(planId,sessionItemId=null){openModal(`<h2>${sessionItemId?'Trocar exercício':'Adicionar exercício'}</h2><div class="searchbar"><input id="pickQ" placeholder="Buscar..." oninput="filterPicker('${planId}','${sessionItemId||''}')"><select id="pickG" onchange="filterPicker('${planId}','${sessionItemId||''}')"><option value="">Todas regiões</option>${[...new Set(allExercises().map(e=>e.group))].sort().map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div id="picker">${pickerHtml(allExercises(),planId,sessionItemId)}</div>`)}
function filterPicker(planId,sid){let q=pickQ.value.toLowerCase(),g=pickG.value;let arr=allExercises().filter(e=>(!g||e.group===g)&&(!q||[e.name,e.group,e.muscles].join(' ').toLowerCase().includes(q)));picker.innerHTML=pickerHtml(arr,planId,sid||null)}
function pickerHtml(arr,planId,sid){return arr.map(e=>`<button class="btn" style="width:100%;text-align:left;margin-bottom:7px" onclick="${sid?`doSwap('${sid}','${e.id}')`:`addExercise('${planId}','${e.id}')`}"><b>${esc(e.name)}</b><div class="ex-meta">${esc(e.group)} · ${esc(e.muscles)}</div></button>`).join('')}
function addExercise(planId,eid){let p=state.plans.find(x=>x.id===planId);if(!p)return;let e=allExercises().find(x=>x.id===eid);let otherPlans=state.plans.filter(x=>x.id!==planId&&x.items.some(i=>i.exerciseId===eid));if(otherPlans.length){let where=otherPlans.map(x=>x.name).join(', ');let msg=`${e?.name||'Este exercício'} já está ${otherPlans.length===1?'na ficha':'nas fichas'} ${where}.\n\nDeseja adicionar mesmo assim em ${p.name}?`;if(!confirm(msg))return;}p.items.push({id:crypto.randomUUID(),exerciseId:eid,sets:3,reps:'10-12'});save();editPlan(planId)}
function updateItem(pid,iid,k,v){let i=state.plans.find(x=>x.id===pid).items.find(x=>x.id===iid);i[k]=k==='sets'?Math.max(1,Number(v)||1):v;save()}
function removeItem(pid,iid){let p=state.plans.find(x=>x.id===pid);p.items=p.items.filter(x=>x.id!==iid);save();editPlan(pid)}
function startSession(pid){let p=state.plans.find(x=>x.id===pid);state.session={id:crypto.randomUUID(),planId:pid,startedAt:new Date().toISOString(),items:p.items.map(i=>({...i,sourceExerciseId:i.exerciseId,done:false,substituted:false}))};save();openSession()}
function openSession(){let s=state.session,p=state.plans.find(x=>x.id===s.planId);openModal(`<div class="row between"><div><span class="badge">TREINO EM ANDAMENTO</span><h2 style="margin:3px 0 0">${esc(p?.name||'Treino')}</h2></div><button class="btn small" onclick="closeModal();render()">Minimizar</button></div><div id="sessionItems">${sessionItemsHtml()}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="finishSession()">Concluir treino</button><button class="btn danger" style="width:100%;margin-top:8px" onclick="cancelSession()">Cancelar treino</button>`)}
function sessionItemsHtml(){return state.session.items.map((i,idx)=>{let e=allExercises().find(x=>x.id===i.exerciseId);return `<div class="ex ${i.done?'done':''}"><input class="check" type="checkbox" ${i.done?'checked':''} onchange="toggleDone('${i.id}',this.checked)"><div class="grow"><div class="ex-title">${idx+1}. ${esc(e.name)} ${i.substituted?'<span class="badge">SUBSTITUÍDO</span>':''}</div><div class="ex-meta">${i.sets} séries × ${esc(i.reps)} reps · ${esc(e.group)}</div><div class="muted" style="font-size:12px;margin-top:4px">${esc(e.muscles)}</div><button class="btn small" style="margin-top:8px" onclick="chooseExercise('${state.session.planId}','${i.id}')">↔ Trocar exercício</button></div></div>`}).join('')}
function toggleDone(id,v){state.session.items.find(x=>x.id===id).done=v;save();document.getElementById('sessionItems').innerHTML=sessionItemsHtml()}
function doSwap(sid,eid){let i=state.session.items.find(x=>x.id===sid);i.exerciseId=eid;i.substituted=i.sourceExerciseId!==eid;save();openSession()}
function finishSession(){let s=state.session,p=state.plans.find(x=>x.id===s.planId);state.history.push({id:s.id,planName:p?.name||'Treino',finishedAt:new Date().toISOString(),completed:s.items.filter(i=>i.done).length,total:s.items.length,substitutions:s.items.filter(i=>i.substituted).length});state.session=null;save();closeModal();setTab('history')}
function cancelSession(){state.session=null;save();closeModal();render()}
render();
initCloud();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
